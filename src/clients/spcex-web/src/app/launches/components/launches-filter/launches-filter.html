<mat-button-toggle-group
  appearance="standard"
  color="primary"
  [hideSingleSelectionIndicator]="true"
  [value]="selectedType"
  (change)="onSelectionChange($event)"
  aria-label="Choose which launches to show"
>
  @for (item of items; track item.type) {
    <mat-button-toggle [value]="item.type">{{ item.label }}</mat-button-toggle>
  }
</mat-button-toggle-group>

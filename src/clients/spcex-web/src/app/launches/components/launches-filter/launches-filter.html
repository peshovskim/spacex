<div class="filter-toggle" role="group" aria-label="Choose which launches to show">
  @for (item of items; track item.type) {
    <button
      type="button"
      class="filter-toggle__btn"
      [class.is-active]="selectedType === item.type"
      (click)="onSelect(item.type)"
    >
      {{ item.label }}
    </button>
  }
</div>

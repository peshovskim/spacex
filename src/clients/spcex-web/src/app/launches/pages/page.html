<div class="page">
  <nav class="shell-nav border-bottom bg-white" aria-label="Main">
    <div class="shell-nav-inner container-fluid py-2 px-3 px-md-4">
      <div class="shell-nav-brand d-flex align-items-center gap-2">
        <span
          class="shell-brand-mark d-inline-flex align-items-center justify-content-center flex-shrink-0 rounded-circle"
        >
          <mat-icon class="shell-brand-icon" aria-hidden="true">rocket_launch</mat-icon>
        </span>
        <span class="shell-title fw-semibold text-dark">SpaceX Launches</span>
      </div>
      <div class="shell-nav-filter">
        <app-launches-filter
          class="launches-filter--toolbar"
          [selectedType]="activeType()"
          (selectedTypeChange)="onTypeChange($event)"
        />
      </div>
      <div class="shell-nav-actions d-flex align-items-center gap-1">
        <button
          type="button"
          class="btn btn-link text-secondary p-2 shell-icon-btn"
          aria-label="Account"
        >
          <mat-icon>account_circle</mat-icon>
        </button>
        <button
          type="button"
          class="btn btn-outline-secondary d-inline-flex align-items-center gap-1 rounded-3 shell-signout"
          (click)="signOut()"
        >
          <mat-icon class="shell-signout-icon">logout</mat-icon>
          Sign out
        </button>
      </div>
    </div>
  </nav>

  <main class="page-body">
    <div class="page-heading border rounded-3 bg-white shadow-sm">
      <h1 class="page-heading-title mb-0 fw-bold text-dark">
        {{ pageTitle() | titlecase }}
      </h1>
    </div>

    <app-launches-list
      [launches]="launches()"
      [totalCount]="totalCount()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [sortActive]="sortActive()"
      [sortDirection]="sortDirection()"
      [hidePaginator]="activeType() === 'latest'"
      [loading]="loading()"
      [errorMessage]="errorMessage()"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
    />
  </main>
</div>
